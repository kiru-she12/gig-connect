<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" />
      <feOffset dx="0" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Connections -->
  <g stroke="currentColor" stroke-opacity="0.1" stroke-width="1">
    <line x1="50" y1="20" x2="35" y2="35" />
    <line x1="50" y1="20" x2="65" y2="35" />
    <line x1="35" y1="35" x2="20" y2="50" />
    <line x1="35" y1="35" x2="40" y2="50" />
    <line x1="65" y1="35" x2="60" y2="50" />
    <line x1="65" y1="35" x2="80" y2="50" />
    <line x1="20" y1="50" x2="35" y2="65" />
    <line x1="40" y1="50" x2="35" y2="65" />
    <line x1="60" y1="50" x2="65" y2="65" />
    <line x1="80" y1="50" x2="65" y2="65" />
    <line x1="35" y1="65" x2="50" y2="80" />
    <line x1="65" y1="65" x2="50" y2="80" />
    
    <line x1="35" y1="35" x2="65" y2="35" />
    <line x1="40" y1="50" x2="60" y2="50" />
    <line x1="20" y1="50" x2="40" y2="50" />
    <line x1="60" y1="50" x2="80" y2="50" />
    <line x1="35" y1="65" x2="65" y2="65" />
  </g>

  <!-- Dots -->
  <g filter="url(#shadow)">
    <circle cx="50" cy="20" r="6" fill="#0EA5E9" /> <!-- Cyan -->
    <circle cx="35" cy="35" r="6" fill="#F59E0B" /> <!-- Yellow/Amber -->
    <circle cx="65" cy="35" r="6" fill="#F97316" /> <!-- Orange -->
    <circle cx="20" cy="50" r="6" fill="#EF4444" /> <!-- Red -->
    <circle cx="40" cy="50" r="6" fill="#F97316" /> <!-- Orange -->
    <circle cx="60" cy="50" r="6" fill="#EF4444" /> <!-- Red -->
    <circle cx="80" cy="50" r="6" fill="#0EA5E9" /> <!-- Cyan -->
    <circle cx="35" cy="65" r="6" fill="#10B981" /> <!-- Green -->
    <circle cx="65" cy="65" r="6" fill="#84CC16" /> <!-- Lime -->
    <circle cx="50" cy="80" r="6" fill="#F97316" /> <!-- Orange -->
  </g>
</svg>
